# Cloud overlay for EKS / GKE (ADR 0006, ADR 0014, ADR 0015). No database resources: Postgres is managed
# (RDS, Cloud SQL), and DATABASE_URL comes from the Secret enron-db, which is created out of band and is
# deliberately not defined here, e.g.
#   kubectl -n enron create secret generic enron-db \
#     --from-literal=DATABASE_URL='postgres://USER:PASSWORD@HOST:5432/enron?sslmode=require'
# Do not edit this overlay per environment (make k8s-validate expects the placeholder below). Set the real image,
# and any enron-data size patch, in a gitignored overlay deploy/k8s/overlays/<env>-local/ with `resources: [../cloud]`
# and an `images` entry for REGISTRY/enron-service; see the README "Cloud (EKS, GKE)".
# The StorageClass is the cluster default (gp3 on EKS, standard-rwo on GKE) and enron-data keeps the base 10Gi.
# On ext4 keep at least 10Gi (530,000 free inodes and 4 GiB free are required); go smaller only with a StorageClass
# whose filesystem allocates inodes dynamically (e.g. XFS).
# Warning: `kubectl delete -k` on this overlay deletes the enron Namespace, and with it the Secret and the dataset PVC.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: enron

resources:
  - ../../base

images:
  - name: enron-service
    newName: REGISTRY/enron-service
    newTag: VERSION
