# enron-service (ADR 0006, ADR 0014). One replica with Recreate: the dataset PVC is ReadWriteOnce, so a rolling
# update could not attach it to the new pod while the old one runs. No PodDisruptionBudget: with one replica a PDB
# either blocks node drains forever (minAvailable: 1) or permits the eviction anyway, so it adds nothing.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: enron-service
  labels:
    app.kubernetes.io/name: enron-service
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: enron-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: enron-service
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: /metrics
    spec:
      # Above the service's worst-case shutdown: SHUTDOWN_DRAIN_DELAY 5s + SHUTDOWN_TIMEOUT 20s + ~5s closers = 30s.
      terminationGracePeriodSeconds: 40
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        # How /data becomes writable for uid 65532 depends on the volume type:
        # - Cloud block volumes (EBS gp3, GCE PD via CSI) support fsGroup: kubelet makes the volume root group 65532
        #   and group-writable (setgid) before the container starts.
        # - kind's local-path provisioner backs the PVC with a hostPath directory that it creates with mode 0777;
        #   kubelet does not apply fsGroup to hostPath volumes, so the directory is writable regardless.
        fsGroup: 65532
        # Only change ownership when the volume root does not match. The default (Always) would chown the whole
        # extracted dataset (about 517k files) recursively on every pod start on volumes that support fsGroup.
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: enron-service
          # The tag is set by each overlay (kustomize `images`).
          image: enron-service
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: enron-service-config
            - secretRef:
                # DATABASE_URL. Generated by overlays/kind; created out of band in the cloud (see the README).
                name: enron-db
          # The service only listens once it has removed leftover $DATA_DIR/.fetch-tmp-* trees and opened and
          # migrated the database (bounded by DB_STARTUP_TIMEOUT, 60s). 30 x 5s = 150s covers both; liveness and
          # readiness only start once this succeeds.
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 30
          # Process only; never checks the database, so a database outage does not restart the pod.
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          # /readyz pings the database with a 2s timeout in the app, so the probe timeout must be longer than 2s
          # (the Kubernetes default of 1s would mark the pod unready whenever the check is slow).
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: enron-data
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
