apiVersion: v1
kind: Namespace
metadata:
  name: enron
  labels:
    # Pod Security Admission: every pod in the namespace (the app, and Postgres in kind) must meet the
    # "restricted" profile: non-root, no privilege escalation, all capabilities dropped, RuntimeDefault seccomp.
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
