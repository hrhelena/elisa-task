# Non-secret configuration, loaded with envFrom. DATABASE_URL is not here: it comes from the Secret enron-db
# (generated by the kind overlay, created out of band in the cloud). See the README "Configuration" section.
apiVersion: v1
kind: ConfigMap
metadata:
  name: enron-service-config
data:
  HTTP_ADDR: ":8080"
  # The PVC enron-data is mounted here; POST /fetch extracts the dataset to /data/maildir.
  DATA_DIR: /data
  LOG_LEVEL: info
  INGEST_WORKERS: "4"
  INGEST_BATCH_SIZE: "2000"
  DATASET_URL: https://www.cs.cmu.edu/~enron/enron_mail_20150507.tar.gz
  # Shutdown on SIGTERM: report not-ready and keep serving for SHUTDOWN_DRAIN_DELAY (so the endpoint leaves
  # the Service before connections close), then http.Server.Shutdown bounded by SHUTDOWN_TIMEOUT, then about
  # 5s for closers. Worst case 5 + 20 + 5 = 30s, below terminationGracePeriodSeconds (40) in deployment.yaml.
  SHUTDOWN_DRAIN_DELAY: 5s
  SHUTDOWN_TIMEOUT: 20s
  # How long startup waits for the database (#27). Must stay below the startupProbe budget (150s).
  DB_STARTUP_TIMEOUT: 60s
