# CI (ADR 0008): lint, unit tests with -race, integration tests with testcontainers.
# Every step goes through the Makefile, so CI runs exactly what developers run locally.
# Job names (lint, test, itest) are stable so they can be required status checks.
# Third-party actions are pinned to full commit SHAs; the comment gives the release tag.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # The hashed lock requirements-dev.txt was generated on 3.14 and also installs on 3.12+.
  PYTHON_VERSION: "3.14"

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache golangci-lint analysis
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/golangci-lint
          key: golangci-lint-${{ runner.os }}-${{ hashFiles('go.sum', '.golangci.yml') }}-${{ github.sha }}
          restore-keys: |
            golangci-lint-${{ runner.os }}-${{ hashFiles('go.sum', '.golangci.yml') }}-

      - name: Install project-local tools
        run: make tools

      # All pre-commit hooks on all files: gofmt -s and goimports (fails listing unformatted files),
      # go mod tidy -diff (fails printing the go.mod/go.sum diff), whitespace, EOF and YAML checks.
      # golangci-lint and go vet are skipped here because `make lint` runs them in the next step.
      - name: Pre-commit hooks (format, go mod tidy, file checks)
        run: make pre-commit
        env:
          SKIP: golangci-lint,go-vet

      - name: Show changes made by fixing hooks
        if: failure()
        run: git --no-pager diff

      - name: golangci-lint and go vet
        run: make lint

  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Unit tests (-race)
        run: make test TEST_FLAGS="-coverprofile=coverage.out -covermode=atomic"

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: coverage.out
          if-no-files-found: warn
          retention-days: 14

  itest:
    name: itest
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      # ubuntu-latest ships a running Docker daemon, which testcontainers-go uses directly
      # (Ryuk enabled, so containers are reaped even if a test panics).
      - name: Docker info
        run: docker version

      - name: Integration tests (-race, -tags integration)
        run: make itest
