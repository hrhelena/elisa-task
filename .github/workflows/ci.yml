# CI (ADR 0008): lint, unit tests with -race, integration tests with testcontainers, image build + smoke test,
# Kubernetes manifest validation, and an end-to-end test on kind.
# Every step goes through the Makefile (or, for docker and e2e-kind, the script the make target runs), so CI runs what
# developers run locally; the docker and e2e-kind jobs build with build-push-action only to use the GHA layer cache.
# Job names (lint, test, itest) are stable so they can be required status checks.
# Third-party actions are pinned to full commit SHAs; the comment gives the release tag.
name: CI

on:
  pull_request:
  push:
    branches: [main]

# Branches and PRs: a new push cancels the ref's older run. main: one group per commit, so no
# merge commit's run is ever cancelled or replaced and every commit on main gets a full result.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  # The hashed lock requirements-dev.txt was generated on 3.14 and also installs on 3.12+.
  PYTHON_VERSION: "3.14"

jobs:
  lint:
    name: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          # A key of its own: the lint job's build cache holds the tool modules and golangci-lint's
          # build objects, which the test jobs' cache (keyed on go.sum only) does not.
          cache-dependency-path: |
            go.sum
            .golangci.yml

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache golangci-lint analysis
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/golangci-lint
          # Saved once per dependency/config hash, restored by prefix otherwise. The cache is
          # content-addressed, so a stale entry only means a miss, never a false pass.
          key: golangci-lint-${{ runner.os }}-${{ hashFiles('go.sum', '.golangci.yml') }}
          restore-keys: |
            golangci-lint-${{ runner.os }}-

      - name: Install project-local tools
        run: make tools

      # All pre-commit hooks on all files: gofmt -s and goimports (fails listing unformatted files),
      # go mod tidy -diff (fails printing the go.mod/go.sum diff), whitespace, EOF, YAML, merge-conflict
      # and large-file checks (the latter uses --enforce-all, since nothing is staged in CI).
      # golangci-lint and go vet are skipped here because `make lint` runs them in the next step.
      - name: Pre-commit hooks (format, go mod tidy, file checks)
        run: make pre-commit
        env:
          SKIP: golangci-lint,go-vet

      - name: Show changes made by fixing hooks
        if: failure()
        run: git --no-pager diff

      - name: golangci-lint and go vet
        run: make lint

  test:
    name: test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Unit tests (-race)
        run: make test TEST_FLAGS="-coverprofile=coverage.out -covermode=atomic"

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: coverage.out
          if-no-files-found: warn
          retention-days: 14

  itest:
    name: itest
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      # GitHub's Ubuntu runners ship a running Docker daemon, which testcontainers-go uses directly
      # (Ryuk enabled, so containers are reaped even if a test panics).
      - name: Docker info
        run: docker version

      - name: Integration tests (-race, -tags integration)
        run: make itest

  # Builds the image (never pushed) and runs the compose smoke test against it (#11).
  # Not named lint/test/itest: those are the required checks.
  docker:
    name: docker
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build image (no push)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          # Load into the runner's Docker so the smoke test can run it.
          load: true
          tags: enron-service:dev
          build-args: |
            VERSION=${{ github.event.pull_request.head.sha || github.sha }}
            REVISION=${{ github.event.pull_request.head.sha || github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test (image and compose stack)
        run: scripts/docker-smoke.sh

  # Kubernetes manifests (#12, #40): render the kustomize base and the overlays (kind, cloud, kind-local-dataset),
  # validate them with kubeconform, assert the tickets' values and check the kind cluster configs that
  # scripts/kind-up.sh generates (scripts/k8s-validate.sh). The kind deployment e2e is the e2e-kind job.
  # Not named lint/test/itest: those are the required checks.
  manifests:
    name: manifests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      # Pinned to the version of the kind node in deploy/kind/cluster.yaml.
      KUBECTL_VERSION: v1.37.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - uses: azure/setup-kubectl@bda439f5f36b99b262ebdcd3613869bddb064c8e # v5.2.0
        with:
          version: ${{ env.KUBECTL_VERSION }}

      - name: Cache kubeconform schemas
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .tools/kubeconform-cache
          # The script pins the schema's Kubernetes version.
          key: kubeconform-schemas-${{ hashFiles('scripts/k8s-validate.sh') }}

      - name: Render, kubeconform and assert (make k8s-validate)
        run: make k8s-validate

      # The Gherkin renders with `kubectl kustomize`; it must match the pinned kustomize used above.
      - name: kubectl kustomize renders the same output
        run: |
          for overlay in kind cloud kind-local-dataset; do
            CGO_ENABLED=0 go tool kustomize build "deploy/k8s/overlays/$overlay" > "/tmp/$overlay.pinned.yaml"
            kubectl kustomize "deploy/k8s/overlays/$overlay" > "/tmp/$overlay.kubectl.yaml"
            diff -u "/tmp/$overlay.pinned.yaml" "/tmp/$overlay.kubectl.yaml"
            echo "overlays/$overlay: kubectl $(kubectl version --client -o json | jq -r .kustomizeVersion) matches the pinned kustomize"
          done

  # End-to-end on kind (#13): a throwaway cluster from deploy/kind/cluster.yaml (pinned node image), the image
  # deployed with scripts/kind-deploy.sh, then POST /fetch of a small generated fixture served in-cluster, POST /start,
  # exact /status counts, /top-senders order, a pod restart and a second ingestion (scripts/kind-e2e.sh). The script
  # prints pod descriptions, logs and events when it fails. Not named lint/test/itest: those are the required checks.
  e2e-kind:
    name: e2e-kind
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      # kind v0.33.0 publishes the node image pinned in deploy/kind/cluster.yaml; kubectl matches its version.
      KIND_VERSION: v0.33.0
      KIND_SHA256: aee6151561422756b764a4ae28e7f44cda5af5a9eead3cc9985112b1de8d8e0d
      KUBECTL_VERSION: v1.37.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # kind-deploy.sh renders the overlay with the pinned kustomize (go tool).
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - uses: azure/setup-kubectl@bda439f5f36b99b262ebdcd3613869bddb064c8e # v5.2.0
        with:
          version: ${{ env.KUBECTL_VERSION }}

      - name: Install kind (pinned, checksum verified)
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          curl -fsSLo "$RUNNER_TEMP/bin/kind" \
            "https://github.com/kubernetes-sigs/kind/releases/download/${KIND_VERSION}/kind-linux-amd64"
          echo "${KIND_SHA256}  $RUNNER_TEMP/bin/kind" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/bin/kind"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Same build as the docker job; it only reads the GHA layer cache, which the docker job writes.
      - name: Build image (no push)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          load: true
          tags: enron-service:dev
          build-args: |
            VERSION=${{ github.event.pull_request.head.sha || github.sha }}
            REVISION=${{ github.event.pull_request.head.sha || github.sha }}
          cache-from: type=gha

      # Bounded well below timeout-minutes, so that on a hang (a stalled image pull in kind create or kind load, for
      # example) the script itself gets SIGTERM (timeout signals its whole process group) and its trap prints the
      # diagnostics and FAIL before the runner kills the job. A normal run takes about 2.5 minutes after the build;
      # 10m + 90s grace + about 2 minutes of setup stays below the 15-minute job timeout.
      - name: End-to-end on kind (scripts/kind-e2e.sh)
        run: timeout --signal=TERM --kill-after=90s 10m scripts/kind-e2e.sh
        env:
          KIND_CLUSTER: elisa-enron-e2e
          IMAGE: enron-service:dev

      # Normally the script deletes its cluster even on failure; one is left only if the script was killed. Then
      # export the node and pod logs kind collects.
      - name: Export kind logs if the cluster is still there
        if: failure()
        run: |
          if kind get clusters 2>/dev/null | grep -x elisa-enron-e2e >/dev/null; then
            kind export logs "$RUNNER_TEMP/kind-logs" --name elisa-enron-e2e
          else
            echo "no leftover cluster; the diagnostics are in the previous step's log"
          fi

      - name: Upload kind logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kind-logs
          path: ${{ runner.temp }}/kind-logs
          if-no-files-found: ignore
          retention-days: 14
